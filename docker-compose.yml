name: spry

services:
  postgres:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_USER: spry
      POSTGRES_PASSWORD: spry
      POSTGRES_DB: spry
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spry -d spry"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://spry:spry@postgres:5432/spry
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()\""]
      interval: 5s
      timeout: 3s
      retries: 12

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').connect(5173, '127.0.0.1').on('connect', function(){process.exit(0)}).on('error', function(){process.exit(1)})\""]
      interval: 5s
      timeout: 3s
      retries: 12
