[build-system]
requires = ["setuptools==70.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "spry-backend"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "alembic==1.13.2",
  "anthropic[bedrock]==2.3.0",
  "boto3==1.43.120",
  "fastapi==0.111.0",
  "psycopg[binary]==3.1.19",
  "PyJWT[crypto]==2.10.1",
  "SQLAlchemy==2.0.31",
  "uvicorn==0.30.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
