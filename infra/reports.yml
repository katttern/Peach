AWSTemplateFormatVersion: "2010-09-09"
Description: Weekly meetings report - schedule, SQS, S3 and SES

Parameters:
  ProjectName:
    Type: String
    Default: peach
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  RouteTableIds:
    Type: List<String>
  ImageUri:
    Type: String
  DatabaseHost:
    Type: String
    Description: Private endpoint hostname of the Lab 4 Aurora cluster
  DatabaseSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group attached to the Lab 4 Aurora cluster
  DbPassword:
    Type: String
    NoEcho: true
  SenderDomain:
    Type: String
    Description: Verified SES sending domain, without reports@ prefix
  SenderEmail:
    Type: String
  RecipientEmail:
    Type: String
  ScheduleExpression:
    Type: String
    Default: cron(0 7 ? * MON *)
  FailWeek:
    Type: String
    Default: none

Resources:
  # ---------- network and existing Lab 4 database ----------
  FunctionSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Report builder function
      VpcId: !Ref VpcId
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  DatabaseIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref FunctionSg

  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds: !Ref RouteTableIds

  # ---------- bucket ----------
  Bucket:
    Type: AWS::S3::Bucket
    DependsOn: MailerPermission
    Properties:
      BucketName: !Sub ${ProjectName}-reports-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-reports
            Status: Enabled
            Prefix: reports/
            ExpirationInDays: 90
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt MailerFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: reports/
                  - Name: suffix
                    Value: .csv
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # ---------- queue ----------
  Dlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: report-requests-dlq
      MessageRetentionPeriod: 1209600
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  Queue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: report-requests
      VisibilityTimeout: 720
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt Dlq.Arn
        maxReceiveCount: 3
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # ---------- builder (in the VPC) ----------
  BuilderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: builder
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt Queue.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  BuilderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectName}-report-builder
      RetentionInDays: 7
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  BuilderFunction:
    Type: AWS::Lambda::Function
    DependsOn: BuilderLogGroup
    Properties:
      FunctionName: !Sub ${ProjectName}-report-builder
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Role: !GetAtt BuilderRole.Arn
      Timeout: 120
      MemorySize: 512
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds: [!Ref FunctionSg]
      Environment:
        Variables:
          DATABASE_URL: !Sub postgresql+psycopg://spry:${DbPassword}@${DatabaseHost}:5432/spry
          REPORTS_BUCKET: !Sub ${ProjectName}-reports-${AWS::AccountId}
          FAIL_WEEK: !Ref FailWeek
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  BuilderQueueMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref BuilderFunction
      EventSourceArn: !GetAtt Queue.Arn
      BatchSize: 1

  # ---------- schedule ----------
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: send-to-queue
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt Queue.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  WeeklySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub ${ProjectName}-weekly-report
      ScheduleExpression: !Ref ScheduleExpression
      ScheduleExpressionTimezone: Europe/Kyiv
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt Queue.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"week": null, "source": "schedule"}'

  # ---------- mailer (outside the VPC) ----------
  MailerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: mailer
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  MailerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectName}-report-mailer
      RetentionInDays: 7
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  MailerFunction:
    Type: AWS::Lambda::Function
    DependsOn: MailerLogGroup
    Properties:
      FunctionName: !Sub ${ProjectName}-report-mailer
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt MailerRole.Arn
      Timeout: 30
      Environment:
        Variables:
          SENDER: !Ref SenderEmail
          RECIPIENTS: !Ref RecipientEmail
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      Code:
        ZipFile: |
          import logging
          import os
          import urllib.parse
          from email.message import EmailMessage

          import boto3

          log = logging.getLogger()
          log.setLevel(logging.INFO)
          s3 = boto3.client("s3")
          ses = boto3.client("sesv2")


          def handler(event, context):
              for rec in event["Records"]:
                  bucket = rec["s3"]["bucket"]["name"]
                  key = urllib.parse.unquote_plus(rec["s3"]["object"]["key"])
                  log.info(
                      "report-mailer triggered trigger=s3 event=%s bucket=%s key=%s",
                      rec["eventName"], bucket, key,
                  )
                  body = s3.get_object(Bucket=bucket, Key=key)["Body"].read()
                  name = key.rsplit("/", 1)[-1]
                  msg = EmailMessage()
                  msg["Subject"] = "Weekly meetings report " + name[:-4]
                  msg["From"] = os.environ["SENDER"]
                  msg["To"] = os.environ["RECIPIENTS"]
                  msg.set_content("The weekly meetings report is attached as " + name + ".")
                  msg.add_attachment(
                      body, maintype="text", subtype="csv", filename=name
                  )
                  ses.send_email(Content={"Raw": {"Data": msg.as_bytes()}})
                  log.info("report-mailer sent key=%s to=%s", key, os.environ["RECIPIENTS"])

  MailerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref MailerFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}
      SourceAccount: !Ref AWS::AccountId

  SesSenderDomainIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref SenderDomain

  SesRecipientIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref RecipientEmail

Outputs:
  BucketName:
    Value: !Ref Bucket
  QueueUrl:
    Value: !Ref Queue
  DlqUrl:
    Value: !Ref Dlq
  BuilderFunction:
    Value: !Ref BuilderFunction
  SesDkimCname1Name:
    Value: !GetAtt SesSenderDomainIdentity.DkimDNSTokenName1
  SesDkimCname1Value:
    Value: !GetAtt SesSenderDomainIdentity.DkimDNSTokenValue1
  SesDkimCname2Name:
    Value: !GetAtt SesSenderDomainIdentity.DkimDNSTokenName2
  SesDkimCname2Value:
    Value: !GetAtt SesSenderDomainIdentity.DkimDNSTokenValue2
  SesDkimCname3Name:
    Value: !GetAtt SesSenderDomainIdentity.DkimDNSTokenName3
  SesDkimCname3Value:
    Value: !GetAtt SesSenderDomainIdentity.DkimDNSTokenValue3
