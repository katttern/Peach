AWSTemplateFormatVersion: "2010-09-09"
Description: Agenda parser - Lambda Function URL calling Claude on Bedrock (us-east-1)

Parameters:
  ProjectName:
    Type: String
    Default: peach
  ImageUri:
    Type: String
    Description: backend/Dockerfile.lambda image in the us-east-1 ECR repo
  ParserModel:
    Type: String
    Default: us.amazon.nova-pro-v1:0
    Description: '"anthropic.*" uses the Messages API on bedrock-mantle; anything else uses Converse'
  CognitoAuthority:
    Type: String
    Description: Authority output of the peach-auth stack
  CognitoClientId:
    Type: String
    Description: ClientId output of the peach-auth stack
  AllowedOrigins:
    Type: CommaDelimitedList
    Description: Browser origins allowed by the Function URL CORS config
  AlertEmail:
    Type: String

Resources:
  # ---------- parser (outside the VPC, no database) ----------
  ParserRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: parser
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Messages API on bedrock-mantle, not bedrock:InvokeModel.
              # Narrowing Resource to the model is open for discussion.
              - Effect: Allow
                Action: bedrock-mantle:CreateInference
                Resource: "*"
              # Converse for Amazon Nova. The us.* inference profile routes to
              # several US regions, so the foundation model is allowed in any.
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - arn:aws:bedrock:*::foundation-model/amazon.nova-*
                  - !Sub arn:aws:bedrock:us-east-1:${AWS::AccountId}:inference-profile/us.amazon.nova-*
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ParserLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectName}-agenda-parser
      RetentionInDays: 7
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ParserFunction:
    Type: AWS::Lambda::Function
    DependsOn: ParserLogGroup
    Properties:
      FunctionName: !Sub ${ProjectName}-agenda-parser
      PackageType: Image
      Architectures: [x86_64]
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command: [app.ai.agenda_lambda.handler]
      Role: !GetAtt ParserRole.Arn
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          PARSER_MODEL: !Ref ParserModel
          COGNITO_AUTHORITY: !Ref CognitoAuthority
          COGNITO_CLIENT_ID: !Ref CognitoClientId
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # ---------- public URL (JWT is checked in the handler) ----------
  ParserUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ParserFunction.Arn
      AuthType: NONE
      Cors:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [POST]
        AllowHeaders: [authorization, content-type]
        MaxAge: 300

  ParserUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref ParserFunction
      Principal: "*"
      FunctionUrlAuthType: NONE

  ParserInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ParserFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # ---------- cost guard ----------
  # Account-wide: PROJECT_NAME is not activated as a cost allocation tag.
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub ${ProjectName}-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 5
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
      ResourceTags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

Outputs:
  ParserUrl:
    Value: !GetAtt ParserUrl.FunctionUrl
  FunctionName:
    Value: !Ref ParserFunction
